<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Tôi - E-Tech Store</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/StaggeredMenu.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            background-color: #f5f5f7;
            /* Apple Parchment background */
            color: #1d1d1f;
            font-family: "SF Pro Text", "Inter", -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .orders-page-wrapper {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 24px;
            min-height: 70vh;
        }

        .orders-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .orders-title {
            font-family: "SF Pro Display", "Outfit", -apple-system, sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.374px;
            margin: 0;
        }

        .refresh-btn {
            background: #ffffff;
            border: 1px solid #d2d2d7;
            border-radius: 9999px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            color: #0066cc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .refresh-btn:hover {
            background: #f5f5f7;
            border-color: #0066cc;
        }

        .orders-status-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .orders-status-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 9999px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #515154;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: #0066cc;
            color: #0066cc;
        }

        .tab-btn.active {
            background: #0066cc;
            border-color: #0066cc;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.25);
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .order-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            /* Apple rounded.lg */
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .order-header {
            background: #fafafc;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-info-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-code {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .order-date {
            font-size: 13px;
            color: #7a7a7a;
        }

        .order-status-badge {
            padding: 6px 14px;
            border-radius: 9999px;
            /* Pill radius */
            font-size: 13px;
            font-weight: 500;
            text-transform: capitalize;
        }

        /* Apple style soft translucent status badges */
        .status-pending {
            background-color: rgba(217, 119, 6, 0.1);
            color: #b45309;
        }

        .status-confirmed {
            background-color: rgba(0, 102, 204, 0.1);
            color: #0066cc;
        }

        .status-active {
            background-color: rgba(5, 150, 105, 0.1);
            color: #047857;
        }

        .status-completed {
            background-color: rgba(5, 150, 105, 0.15);
            color: #065f46;
        }

        .status-cancelled {
            background-color: rgba(220, 38, 38, 0.1);
            color: #b91c1c;
        }

        .status-delivering {
            background-color: rgba(59, 130, 246, 0.1);
            color: #1d4ed8;
        }

        .status-returning {
            background-color: rgba(139, 92, 246, 0.1);
            color: #6d28d9;
        }

        .order-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-item:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .order-item-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #e3e4e5;
            background: #ffffff;
            padding: 6px;
        }

        .order-item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .order-item-name {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .order-item-name:hover {
            color: #0066cc;
            /* Action Blue */
        }

        .order-item-meta {
            font-size: 13px;
            color: #7a7a7a;
        }

        .order-item-price-qty {
            font-size: 14px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .order-footer {
            padding: 20px 24px;
            background: #fafafc;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-rental-dates {
            font-size: 14px;
            color: #515154;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .order-rental-dates i {
            color: #0066cc;
        }

        .order-total-price {
            font-size: 17px;
            font-weight: 600;
            color: #0066cc;
            /* Action Blue */
        }

        .no-orders {
            text-align: center;
            padding: 60px 24px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
        }

        .no-orders i {
            font-size: 56px;
            color: #d2d2d7;
            margin-bottom: 20px;
        }

        .no-orders p {
            font-size: 17px;
            color: #7a7a7a;
            margin-bottom: 24px;
        }

        .no-orders-btn {
            background-color: #0066cc;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 9999px;
            /* Pill CTA */
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .no-orders-btn:hover {
            background-color: #0071e3;
        }

        .no-orders-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <!-- Header Navigation -->
    <custom-header></custom-header>

    <main class="orders-page-wrapper">
        <div class="orders-header-bar">
            <h1 class="orders-title">Đơn hàng của tôi</h1>
            <button id="refresh-orders-btn" class="refresh-btn" onclick="window.fetchAndRenderOrders()"
                title="Tải lại danh sách đơn hàng">
                <i class="fa-solid fa-rotate-right"></i> Tải lại dữ liệu
            </button>
        </div>

        <div class="orders-status-tabs" id="orders-status-tabs">
            <button class="tab-btn active" data-status="all" onclick="window.filterOrdersByStatus('all')">Tất
                cả</button>
            <button class="tab-btn" data-status="pending" onclick="window.filterOrdersByStatus('pending')">Chờ
                duyệt</button>
            <button class="tab-btn" data-status="confirmed" onclick="window.filterOrdersByStatus('confirmed')">Đã duyệt
                / Giao</button>
            <button class="tab-btn" data-status="active" onclick="window.filterOrdersByStatus('active')">Đang
                thuê</button>
            <button class="tab-btn" data-status="completed" onclick="window.filterOrdersByStatus('completed')">Hoàn
                thành</button>
            <button class="tab-btn" data-status="cancelled" onclick="window.filterOrdersByStatus('cancelled')">Đã
                hủy</button>
        </div>

        <div id="orders-container">
            <div class="no-orders">
                <i class="fa-solid fa-spinner fa-spin" style="color:#0066cc"></i>
                <p>Đang tải đơn hàng của bạn...</p>
            </div>
        </div>
    </main>

    <!-- Global components -->
    <script src="js/popup-component.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components.js"></script>
    <script>
        window.allOrders = [];
        window.currentStatusFilter = 'all';

        // Helper function to get customer ID from localStorage
        function getCustomerIdFromStorage() {
            const userStr = localStorage.getItem('currentUser');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    const id = user.id || user.customerId || user.customer_id;
                    if (id) return id;
                } catch (e) { }
            }
            const token = localStorage.getItem('accessToken');
            if (token) {
                try {
                    const base64Url = token.split('.')[1];
                    if (base64Url) {
                        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                        const payload = JSON.parse(window.atob(base64));
                        return payload.id || payload.customerId || payload.customer_id || null;
                    }
                } catch (e) { }
            }
            return null;
        }

        // Load & pull order history
        window.fetchAndRenderOrders = async () => {
            const container = document.getElementById('orders-container');
            const refreshBtn = document.getElementById('refresh-orders-btn');

            const customerId = getCustomerIdFromStorage();
            if (!customerId) {
                container.innerHTML = `
                    <div class="no-orders">
                        <i class="fa-solid fa-user-lock"></i>
                        <p>Vui lòng đăng nhập để xem lịch sử đơn hàng của bạn.</p>
                        <a href="auth.html" class="no-orders-btn">Đăng nhập ngay</a>
                    </div>
                `;
                return;
            }

            if (refreshBtn) {
                refreshBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tải...`;
                refreshBtn.disabled = true;
            }

            try { // gọi controller
                const res = await apiFetch('/api/orders');
                if (!res.success || !res.orders) {
                    container.innerHTML = `
                        <div class="no-orders">
                            <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
                            <p>${res.message || 'Không thể lấy dữ liệu lịch sử đơn hàng.'}</p>
                            <a href="#" class="no-orders-btn" onclick="window.fetchAndRenderOrders(); return false;">Thử lại</a>
                        </div>
                    `;
                    return;
                }

                window.allOrders = res.orders;
                window.renderFilteredOrders();

            } catch (error) {
                console.error('Error rendering orders:', error);
                container.innerHTML = `
                    <div class="no-orders">
                        <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
                        <p>Lỗi kết nối khi tải lịch sử đơn hàng. Vui lòng tải lại.</p>
                        <a href="#" class="no-orders-btn" onclick="window.fetchAndRenderOrders(); return false;">Tải lại</a>
                    </div>
                `;
            } finally {
                if (refreshBtn) {
                    refreshBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Tải lại dữ liệu`;
                    refreshBtn.disabled = false;
                }
            }
        };
        //Chọn đơn muốn xem trạng thái
        window.filterOrdersByStatus = (status) => {
            window.currentStatusFilter = status;
            document.querySelectorAll('#orders-status-tabs .tab-btn').forEach(btn => {
                if (btn.getAttribute('data-status') === status) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            window.renderFilteredOrders();
        };
        // Kiểm tra đơn thuê
        window.renderFilteredOrders = () => {
            const container = document.getElementById('orders-container');
            let filtered = window.allOrders || [];

            if (window.currentStatusFilter !== 'all') {
                if (window.currentStatusFilter === 'confirmed') {
                    filtered = filtered.filter(o => o.rental_order_status === 'confirmed' || o.rental_order_status === 'delivering');
                } else {
                    filtered = filtered.filter(o => o.rental_order_status === window.currentStatusFilter);
                }
            }
            //Chưa có đơn hàng nào
            if (filtered.length === 0) {
                let msg = 'Bạn chưa có đơn hàng nào.';
                if (window.currentStatusFilter !== 'all') {
                    msg = 'Không tìm thấy đơn hàng nào ở trạng thái này.';
                }
                container.innerHTML = `
                    <div class="no-orders">
                        <i class="fa-solid fa-box-open"></i>
                        <p>${msg}</p>
                        <a href="products.html" class="no-orders-btn">Thuê thiết bị ngay</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            const listDiv = document.createElement('div');
            listDiv.className = 'orders-list';

            filtered.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';

                // Formatted dates
                const orderDateStr = new Date(order.create_date).toLocaleDateString('vi-VN', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const startStr = new Date(order.rental_start_date).toLocaleDateString('vi-VN');
                const endStr = new Date(order.expected_return_date).toLocaleDateString('vi-VN');
                const totalStr = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(order.total_amount);

                // Translate status
                let statusText = 'Chờ duyệt';
                let statusClass = 'status-pending';
                if (order.rental_order_status === 'confirmed') {
                    statusText = 'Đã duyệt';
                    statusClass = 'status-confirmed';
                } else if (order.rental_order_status === 'active') {
                    statusText = 'Đang thuê';
                    statusClass = 'status-active';
                } else if (order.rental_order_status === 'completed') {
                    statusText = 'Hoàn thành';
                    statusClass = 'status-completed';
                } else if (order.rental_order_status === 'cancelled') {
                    statusText = 'Đã hủy';
                    statusClass = 'status-cancelled';
                } else if (order.rental_order_status === 'delivering') {
                    statusText = 'Đang giao hàng';
                    statusClass = 'status-delivering';
                } else if (order.rental_order_status === 'returning') {
                    statusText = 'Đang hoàn trả';
                    statusClass = 'status-returning';
                }

                // Render items
                let itemsHtml = '';
                if (order.items && order.items.length > 0) {
                    order.items.forEach(item => {
                        const priceStr = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.unit_rental_price);
                        itemsHtml += `
                            <div class="order-item">
                                <img src="${item.default_image || 'https://via.placeholder.com/90'}" class="order-item-img" alt="${item.device_name}">
                                <div class="order-item-details">
                                    <span class="order-item-name">${item.device_name}</span>
                                    <span class="order-item-meta">Cấu hình: ${item.color || ''}, ${item.capacity || ''} | Thuê: ${item.rental_days} ngày</span>
                                    <span class="order-item-price-qty">${priceStr} / ngày  ×  Số lượng: ${item.rental_quantity}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                const oId = order.rental_order_id || order.rentalOrderId;
                const firstItemDeviceId = order.items && order.items.length > 0 ? order.items[0].device_id : '';

                card.innerHTML = `
                    <div class="order-header">
                        <div class="order-info-left">
                            <span class="order-code">Mã đơn: ${order.order_code}</span>
                            <span class="order-date">Ngày đặt: ${orderDateStr}</span>
                        </div>
                        <span class="order-status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="order-body">
                        ${itemsHtml}
                    </div>
                    <div class="order-shipping-info" style="padding: 12px 24px; border-top: 1px dashed #e5e5e7; background: #fafafc; font-size: 13px; color: #515154; text-align: left;">
                        <div style="font-weight: 600; color: #1d1d1f; margin-bottom: 4px;"><i class="fa-solid fa-location-dot" style="margin-right: 6px; color:#0066cc;"></i>Thông tin giao hàng:</div>
                        <div>Người nhận: <strong>${order.shipping_name || 'Chưa cập nhật'}</strong> | SĐT: <strong>${order.shipping_phone || 'Chưa cập nhật'}</strong></div>
                        <div style="margin-top: 2px;">Địa chỉ: <strong>${order.shipping_address || 'Chưa cập nhật'}</strong></div>
                    </div>
                    <div class="order-footer">
                        <span class="order-rental-dates">
                            <i class="fa-regular fa-calendar-days"></i> Thời gian: ${startStr} - ${endStr}
                        </span>
                        <span class="order-total-price">Tổng cộng: ${totalStr}</span>
                    </div>
                    <div class="order-actions-bar" style="padding: 16px 24px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 12px; background: #fafafc;">
                        ${order.rental_order_status === 'pending'
                        ? `
                              <button class="no-orders-btn" style="background-color: transparent; color: #0066cc; border: 1px solid #0066cc; padding: 8px 18px; font-size: 13px; margin-right: 8px;" onclick="window.showEditShippingModal(${oId}, '${(order.shipping_name || '').replace(/'/g, "\\'")}', '${(order.shipping_phone || '').replace(/'/g, "\\'")}', '${(order.shipping_address || '').replace(/'/g, "\\'")}')">Sửa thông tin giao hàng</button>
                              <button class="no-orders-btn" style="background-color: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 8px 18px; font-size: 13px;" onclick="window.cancelOrder(${oId})">Hủy đơn</button>
                              `
                        : order.rental_order_status === 'confirmed'
                            ? `<button class="no-orders-btn" style="background-color: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 8px 18px; font-size: 13px;" onclick="window.cancelOrder(${oId})">Hủy đơn</button>`
                            : order.rental_order_status === 'active'
                                ? `
                              <button class="no-orders-btn" style="background-color: transparent; color: #0066cc; border: 1px solid #0066cc; padding: 8px 18px; font-size: 13px; margin-right: 8px;" onclick="window.showExtendModal(${oId}, '${order.expected_return_date}')">Gia hạn</button>
                              <button class="no-orders-btn" style="background-color: transparent; color: #8b5cf6; border: 1px solid #8b5cf6; padding: 8px 18px; font-size: 13px; margin-right: 8px;" onclick="window.returnOrder(${oId})">Trả hàng</button>
                              <button class="no-orders-btn" style="background-color: transparent; color: #d97706; border: 1px solid #d97706; padding: 8px 18px; font-size: 13px;" onclick="window.reportIssue(${oId})">Báo lỗi thiết bị</button>
                              `
                                : order.rental_order_status === 'completed'
                                    ? `
                              <button class="no-orders-btn" style="background-color: transparent; color: #0066cc; border: 1px solid #0066cc; padding: 8px 18px; font-size: 13px; margin-right: 8px;" onclick="window.reviewOrder(${oId}, ${firstItemDeviceId})">Đánh giá</button>
                              <button class="no-orders-btn" style="padding: 8px 18px; font-size: 13px;" onclick="window.redirectToProductDetails(${firstItemDeviceId})">Đặt lại</button>
                              `
                                    : order.rental_order_status === 'cancelled'
                                        ? `<button class="no-orders-btn" style="padding: 8px 18px; font-size: 13px;" onclick="window.redirectToProductDetails(${firstItemDeviceId})">Đặt lại</button>`
                                        : ''
                    }
                    </div>
                `;
                listDiv.appendChild(card);
            });

            container.appendChild(listDiv);
        };

        //Theo dõi trạng thái đơn thuê
        document.addEventListener('DOMContentLoaded', () => {
            window.fetchAndRenderOrders();
        });

        // Hiển thị popup xác nhận
        window.showConfirmPopup = (message, onConfirm, okText = 'Xác nhận hủy') => {
            const existing = document.getElementById('custom-confirm-popup');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-confirm-popup';
            modal.style = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                opacity: 0;
                transition: opacity 0.25s ease;
            `;

            modal.innerHTML = `
                <div style="
                    background: #ffffff;
                    border-radius: 18px;
                    padding: 28px;
                    width: 90%;
                    max-width: 400px;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
                    text-align: center;
                    transform: translateY(20px);
                    transition: transform 0.25s ease;
                ">
                    <i class="fa-regular fa-circle-question" style="font-size: 48px; color: #ff453a; margin-bottom: 16px; display: block;"></i>
                    <p style="font-size: 16px; font-weight: 500; color: #1d1d1f; margin: 0 0 24px 0; line-height: 1.5; font-family: sans-serif;">${message}</p>
                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button id="confirm-cancel-btn" style="
                            background: #f5f5f7;
                            color: #1d1d1f;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Hủy bỏ</button>
                        <button id="confirm-ok-btn" style="
                            background: #dc2626;
                            color: #ffffff;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">${okText}</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            setTimeout(() => {
                modal.style.opacity = '1';
                modal.children[0].style.transform = 'translateY(0)';
            }, 10);

            const close = () => {
                modal.style.opacity = '0';
                modal.children[0].style.transform = 'translateY(20px)';
                setTimeout(() => modal.remove(), 250);
            };

            modal.querySelector('#confirm-cancel-btn').addEventListener('click', close);
            modal.querySelector('#confirm-ok-btn').addEventListener('click', () => {
                close();
                onConfirm();
            });
        };

        window.showEditShippingModal = (orderId, name, phone, address) => {
            const existing = document.getElementById('edit-shipping-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'edit-shipping-modal';
            modal.style = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                opacity: 0;
                transition: opacity 0.25s ease;
            `;

            modal.innerHTML = `
                <div style="
                    background: #ffffff;
                    border-radius: 18px;
                    padding: 28px;
                    width: 90%;
                    max-width: 450px;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
                    transform: translateY(20px);
                    transition: transform 0.25s ease;
                ">
                    <h4 style="font-size: 18px; font-weight: 600; color: #1d1d1f; margin: 0 0 20px 0; text-align: center; font-family: sans-serif;">Sửa Thông Tin Giao Hàng</h4>
                    
                    <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; text-align: left;">
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 500; color: #7a7a7a; margin-bottom: 6px;">Họ tên người nhận</label>
                            <input type="text" id="ship-name-input" value="${name || ''}" style="width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 500; color: #7a7a7a; margin-bottom: 6px;">Số điện thoại</label>
                            <input type="text" id="ship-phone-input" value="${phone || ''}" style="width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 500; color: #7a7a7a; margin-bottom: 6px;">Địa chỉ giao hàng</label>
                            <textarea id="ship-address-input" style="width: 100%; height: 80px; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; box-sizing: border-box;">${address || ''}</textarea>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; justify-content: flex-end;">
                        <button id="close-shipping-btn" style="
                            background: #f5f5f7;
                            color: #1d1d1f;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Hủy bỏ</button>
                        <button id="save-shipping-btn" style="
                            background: #0066cc;
                            color: #ffffff;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Lưu thay đổi</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            setTimeout(() => {
                modal.style.opacity = '1';
                modal.children[0].style.transform = 'translateY(0)';
            }, 10);

            const close = () => {
                modal.style.opacity = '0';
                modal.children[0].style.transform = 'translateY(20px)';
                setTimeout(() => modal.remove(), 250);
            };

            modal.querySelector('#close-shipping-btn').addEventListener('click', close);
            modal.querySelector('#save-shipping-btn').addEventListener('click', async () => {
                const newName = modal.querySelector('#ship-name-input').value.trim();
                const newPhone = modal.querySelector('#ship-phone-input').value.trim();
                const newAddress = modal.querySelector('#ship-address-input').value.trim();

                if (!newName || !newPhone || !newAddress) {
                    window.showStatusPopup(false, 'Vui lòng điền đầy đủ họ tên, SĐT và địa chỉ.');
                    return;
                }

                try {
                    const res = await apiFetch(`/api/orders/${orderId}/shipping`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            shippingName: newName,
                            shippingPhone: newPhone,
                            shippingAddress: newAddress
                        })
                    });

                    if (res.success) {
                        close();
                        window.showStatusPopup(true, 'Cập nhật thông tin giao hàng thành công!', false);
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        window.showStatusPopup(false, res.message || 'Lỗi cập nhật thông tin.');
                    }
                } catch (err) {
                    console.error('Error updating shipping details:', err);
                    window.showStatusPopup(false, 'Không thể cập nhật thông tin lúc này.');
                }
            });
        };

        window.redirectToProductDetails = (deviceId) => {
            if (!deviceId) {
                window.showStatusPopup(false, 'Không tìm thấy thông tin sản phẩm.');
                return;
            }
            window.location.href = `/product.html?id=${deviceId}`;
        };

        window.showExtendModal = (orderId, currentReturnDateStr) => {
            const existing = document.getElementById('extend-rental-modal');
            if (existing) existing.remove();

            const currentReturnDate = new Date(currentReturnDateStr);
            const minDate = new Date(currentReturnDate);
            minDate.setDate(minDate.getDate() + 1);
            const minDateStr = minDate.toISOString().split('T')[0];

            const modal = document.createElement('div');
            modal.id = 'extend-rental-modal';
            modal.style = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                opacity: 0;
                transition: opacity 0.25s ease;
            `;

            modal.innerHTML = `
                <div style="
                    background: #ffffff;
                    border-radius: 18px;
                    padding: 28px;
                    width: 90%;
                    max-width: 400px;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
                    transform: translateY(20px);
                    transition: transform 0.25s ease;
                ">
                    <h4 style="font-size: 18px; font-weight: 600; color: #1d1d1f; margin: 0 0 20px 0; text-align: center; font-family: sans-serif;">Gia Hạn Thời Gian Thuê</h4>
                    
                    <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; text-align: left;">
                        <p style="font-size: 13px; color: #515154; margin: 0; font-family: sans-serif;">Ngày trả hiện tại: <strong>${new Date(currentReturnDateStr).toLocaleDateString('vi-VN')}</strong></p>
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 500; color: #7a7a7a; margin-bottom: 6px; font-family: sans-serif;">Gia hạn đến ngày</label>
                            <input type="date" id="extend-date-input" min="${minDateStr}" value="${minDateStr}" style="width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box;">
                        </div>
                        <div id="extend-cost-container" style="
                            background: #f5f5f7;
                            border-radius: 10px;
                            padding: 12px;
                            font-size: 13px;
                            font-family: sans-serif;
                            color: #1d1d1f;
                            display: none;
                            flex-direction: column;
                            gap: 8px;
                            border: 1px solid #e5e5ea;
                        ">
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; justify-content: flex-end;">
                        <button id="close-extend-btn" style="
                            background: #f5f5f7;
                            color: #1d1d1f;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Hủy bỏ</button>
                        <button id="save-extend-btn" style="
                            background: #0066cc;
                            color: #ffffff;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Xác nhận gia hạn</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            const dateInput = modal.querySelector('#extend-date-input');
            const costContainer = modal.querySelector('#extend-cost-container');

            const updateExtendCost = async () => {
                const val = dateInput.value;
                if (!val) {
                    costContainer.style.display = 'none';
                    return;
                }
                try {
                    const res = await apiFetch(`/api/orders/${orderId}/extend-cost?newReturnDate=${val}`);
                    if (res.success) {
                        costContainer.style.display = 'flex';
                        let itemsHtml = res.items.map(item => `
                            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #515154; gap: 8px;">
                                <span>${item.deviceName} (${item.capacity || ''} ${item.color || ''}) x${item.quantity}</span>
                                <span style="white-space: nowrap;">+${item.extraCost.toLocaleString('vi-VN')}đ</span>
                            </div>
                        `).join('');

                        costContainer.innerHTML = `
                            <div style="font-weight: 600; font-size: 12px; color: #0066cc; border-bottom: 1px solid #e5e5ea; padding-bottom: 4px; margin-bottom: 4px;">
                                Chi phí gia hạn tạm tính (${res.extraDays} ngày)
                            </div>
                            ${itemsHtml}
                            <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; margin-top: 4px; border-top: 1px solid #e5e5ea; padding-top: 6px;">
                                <span>Tổng cộng:</span>
                                <span style="color: #ff3b30; white-space: nowrap;">${res.totalExtraCost.toLocaleString('vi-VN')}đ</span>
                            </div>
                        `;
                    } else {
                        costContainer.style.display = 'flex';
                        costContainer.innerHTML = `<span style="color: #ff3b30; font-size: 12px;">${res.message || 'Lỗi tính toán chi phí'}</span>`;
                    }
                } catch (err) {
                    console.error('Error fetching extend cost:', err);
                    costContainer.style.display = 'flex';
                    costContainer.innerHTML = `<span style="color: #ff3b30; font-size: 12px;">Không thể tính toán chi phí gia hạn lúc này.</span>`;
                }
            };

            dateInput.addEventListener('change', updateExtendCost);
            // Trigger calculation immediately
            updateExtendCost();

            setTimeout(() => {
                modal.style.opacity = '1';
                modal.children[0].style.transform = 'translateY(0)';
            }, 10);

            const close = () => {
                modal.style.opacity = '0';
                modal.children[0].style.transform = 'translateY(20px)';
                setTimeout(() => modal.remove(), 250);
            };

            modal.querySelector('#close-extend-btn').addEventListener('click', close);
            modal.querySelector('#save-extend-btn').addEventListener('click', async () => {
                const newReturnDate = modal.querySelector('#extend-date-input').value;

                if (!newReturnDate) {
                    window.showStatusPopup(false, 'Vui lòng chọn ngày gia hạn.');
                    return;
                }

                try {
                    const res = await apiFetch(`/api/orders/${orderId}/extend`, {
                        method: 'POST',
                        body: JSON.stringify({ newReturnDate })
                    });

                    if (res.success) {
                        close();
                        window.showStatusPopup(true, 'Gia hạn đơn hàng thành công!', false);
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        window.showStatusPopup(false, res.message || 'Lỗi gia hạn đơn hàng.');
                    }
                } catch (err) {
                    console.error('Error extending order:', err);
                    window.showStatusPopup(false, 'Không thể thực hiện gia hạn lúc này.');
                }
            });
        };

        window.cancelOrder = async (orderId) => {
            window.showConfirmPopup('Bạn có chắc chắn muốn hủy đơn hàng này không?', async () => {
                try {
                    // Chuyển tiếp đến controller để xử lý yêu cầu hủy đơn hàng
                    const res = await apiFetch(`/api/orders/${orderId}/cancel`, { method: 'POST' });
                    if (res.success) {
                        //Nhận phản hồi từ controller
                        window.showStatusPopup(true, 'Đã hủy đơn hàng thành công!', false);
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        //nhận phản hồi từ controller
                        window.showStatusPopup(false, res.message || 'Lỗi hủy đơn hàng.');
                    }
                } catch (e) {
                    //nhận phản hồi từ controller
                    console.error('Error cancelling order:', e);
                    window.showStatusPopup(false, 'Không thể hủy đơn hàng vào lúc này.');
                }
            });
        };

        window.returnOrder = async (orderId) => {
            window.showConfirmPopup('Bạn có chắc chắn muốn yêu cầu trả hàng cho đơn hàng này không?', async () => {
                try {
                    const res = await apiFetch(`/api/orders/${orderId}/return`, { method: 'POST' });
                    if (res.success) {
                        window.showStatusPopup(true, 'Đã gửi yêu cầu trả hàng thành công!', false);
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        window.showStatusPopup(false, res.message || 'Lỗi yêu cầu trả hàng.');
                    }
                } catch (e) {
                    console.error('Error returning order:', e);
                    window.showStatusPopup(false, 'Không thể gửi yêu cầu trả hàng vào lúc này.');
                }
            }, 'Xác nhận trả');
        };

        window.reportIssue = (orderId) => {
            const existing = document.getElementById('report-issue-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'report-issue-modal';
            modal.style = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                opacity: 0;
                transition: opacity 0.25s ease;
            `;

            modal.innerHTML = `
                <div style="
                    background: #ffffff;
                    border-radius: 18px;
                    padding: 28px;
                    width: 90%;
                    max-width: 450px;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
                    transform: translateY(20px);
                    transition: transform 0.25s ease;
                ">
                    <div style="text-align: center; margin-bottom: 16px;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #d97706;"></i>
                    </div>
                    <h4 style="font-size: 18px; font-weight: 600; color: #1d1d1f; margin: 0 0 10px 0; text-align: center; font-family: sans-serif;">Báo Lỗi Thiết Bị</h4>
                    <p style="font-size: 13px; color: #515154; margin: 0 0 16px 0; text-align: center; font-family: sans-serif; line-height: 1.4;">
                        Vui lòng mô tả chi tiết sự cố bạn đang gặp phải với thiết bị.
                    </p>
                    
                    <div style="margin-bottom: 20px; text-align: left;">
                        <label style="display: block; font-size: 12px; font-weight: 500; color: #7a7a7a; margin-bottom: 6px; font-family: sans-serif;">Nội dung sự cố / Báo lỗi</label>
                        <textarea id="issue-note-input" placeholder="Ví dụ: Máy bị nóng, màn hình chớp tắt, không nhận sạc..." style="width: 100%; height: 90px; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 14px; font-family: inherit; resize: vertical; box-sizing: border-box; outline: none;"></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; justify-content: flex-end;">
                        <button id="close-report-btn" style="
                            background: #f5f5f7;
                            color: #1d1d1f;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Hủy bỏ</button>
                        <button id="submit-report-btn" style="
                            background: #d97706;
                            color: #ffffff;
                            border: none;
                            padding: 10px 22px;
                            border-radius: 9999px;
                            font-size: 14px;
                            font-weight: 500;
                            cursor: pointer;
                            transition: background 0.2s;
                        ">Gửi báo lỗi</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            setTimeout(() => {
                modal.style.opacity = '1';
                modal.children[0].style.transform = 'translateY(0)';
            }, 10);

            const close = () => {
                modal.style.opacity = '0';
                modal.children[0].style.transform = 'translateY(20px)';
                setTimeout(() => modal.remove(), 250);
            };

            modal.querySelector('#close-report-btn').addEventListener('click', close);
            modal.querySelector('#submit-report-btn').addEventListener('click', async () => {
                const note = modal.querySelector('#issue-note-input').value.trim();
                if (!note) {
                    window.showStatusPopup(false, 'Vui lòng nhập nội dung mô tả sự cố.');
                    return;
                }

                try {
                    const res = await apiFetch(`/api/orders/${orderId}/report-issue`, {
                        method: 'POST',
                        body: JSON.stringify({ note })
                    });

                    if (res.success) {
                        close();
                        window.showStatusPopup(true, res.message || 'Yêu cầu hỗ trợ kỹ thuật của bạn đã được ghi nhận. Tổng đài viên sẽ gọi hỗ trợ trong vòng 15 phút.', false);
                        if (typeof window.fetchAndRenderOrders === 'function') {
                            window.fetchAndRenderOrders();
                        }
                    } else {
                        window.showStatusPopup(false, res.message || 'Không thể gửi báo lỗi.');
                    }
                } catch (err) {
                    console.error('Error reporting issue:', err);
                    window.showStatusPopup(false, 'Lỗi kết nối khi gửi báo lỗi.');
                }
            });
        };

        window.reviewOrder = (orderId, deviceId) => {
            if (deviceId) {
                window.redirectToProductDetails(deviceId);
            } else {
                window.showStatusPopup(false, 'Không tìm thấy thông tin sản phẩm để đánh giá.');
            }
        };

        window.reorderItems = async (encodedItems) => {
            try {
                const items = JSON.parse(decodeURIComponent(encodedItems));
                window.showStatusPopup(true, 'Đang tiến hành đặt lại thiết bị...');

                // Add each item back to cart
                for (const item of items) {
                    await apiFetch('/api/cart/add', {
                        method: 'POST',
                        body: JSON.stringify({
                            variantId: item.variant_id,
                            quantity: item.rental_quantity
                        })
                    });
                }

                window.showStatusPopup(true, 'Đã thêm tất cả thiết bị vào giỏ hàng!', true);
                setTimeout(() => {
                    window.location.href = '/cart.html';
                }, 1500);
            } catch (e) {
                console.error('Error reordering items:', e);
                window.showStatusPopup(false, 'Có lỗi xảy ra khi đặt lại.');
            }
        };
    </script>
</body>

</html>
