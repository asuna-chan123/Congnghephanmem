<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân — E-Tech Store</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .customer-page-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--space-3xl) var(--space-lg);
            margin-top: var(--nav-height);
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: var(--space-xl);
        }
        
        /* Sidebar (Menu) */
        .customer-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg) 0;
            height: fit-content;
            box-shadow: var(--shadow-sm);
        }
        .customer-avatar {
            text-align: center;
            padding-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border);
            margin-bottom: var(--space-sm);
        }
        .avatar-circle {
            width: 80px; height: 80px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: var(--text-tertiary);
            margin: 0 auto 12px;
        }
        .customer-phone { font-weight: 600; font-size: 18px; }
        .customer-role { font-size: 13px; color: var(--text-secondary); text-transform: capitalize; }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-item {
            padding: 12px var(--space-lg);
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex; align-items: center; gap: 12px;
            transition: var(--transition);
        }
        .sidebar-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .sidebar-item.active {
            color: var(--accent);
            border-right: 3px solid var(--accent);
            background: var(--accent-light);
        }
        .sidebar-item i { width: 20px; text-align: center; }
        
        /* Content Area */
        .customer-content-area {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
            box-shadow: var(--shadow-sm);
        }
        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeUp 0.3s var(--ease-out); }
        
        .section-header-title {
            font-size: 24px; font-weight: 700;
            margin-bottom: var(--space-xl);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border);
        }
        
        /* Form Box */
        .profile-form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg);
        }
        @media (max-width: 768px) {
            .customer-page-wrapper { grid-template-columns: 1fr; }
            .profile-form-grid { grid-template-columns: 1fr; }
        }
        
        /* Transaction Table */
        .wallet-balance-card {
            background: linear-gradient(135deg, #1d1d1f 0%, #434345 100%);
            color: white;
            padding: var(--space-lg) var(--space-2xl);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-xl);
            display: flex; justify-content: space-between; align-items: center;
        }
        .wallet-balance-card h4 { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
        .wallet-balance-card .balance-amount { font-size: 32px; font-weight: 700; }
        
        .txn-table { width: 100%; border-collapse: collapse; text-align: left; }
        .txn-table th { padding: 12px; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .txn-table td { padding: 16px 12px; font-size: 14px; border-bottom: 1px solid var(--border); }
        .txn-type.deposit { color: var(--success); font-weight: 600; }
        .txn-type.withdrawal { color: var(--danger); font-weight: 600; }
    </style>
</head>
<body>

    <custom-header></custom-header>

    <main class="main-content" id="main-content">
        <div class="customer-page-wrapper">
            
            <!-- SIDEBAR -->
            <aside class="customer-sidebar">
                <div class="customer-avatar">
                    <div class="avatar-circle"><i class="fa-regular fa-user"></i></div>
                    <div class="customer-phone" id="display-phone">Đang tải...</div>
                    <div class="customer-role" id="display-role">Khách hàng</div>
                </div>
                <ul class="sidebar-menu">
                    <li class="sidebar-item active" data-target="profile-sec">
                        <i class="fa-regular fa-id-card"></i> Thông tin cá nhân
                    </li>
                    <li class="sidebar-item" data-target="wallet-sec">
                        <i class="fa-solid fa-wallet"></i> Ví & Giao dịch
                    </li>
                    <li class="sidebar-item" id="logout-btn" style="color: var(--danger);">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất
                    </li>
                </ul>
            </aside>

            <!-- MAIN CONTENT -->
            <div class="customer-content-area">
                
                <!-- PROFILE SECTION -->
                <section class="content-section active" id="profile-sec">
                    <h2 class="section-header-title">Hồ sơ của bạn</h2>
                    <form id="profile-form">
                        <div class="profile-form-grid">
                            <div class="auth-field-group">
                                <label>Họ và Tên</label>
                                <input type="text" id="hoTen" class="auth-input" disabled>
                            </div>
                            <div class="auth-field-group">
                                <label>Số CCCD</label>
                                <input type="text" id="cccd" class="auth-input" disabled>
                            </div>
                            <div class="auth-field-group" style="grid-column: span 2;">
                                <label>Địa chỉ</label>
                                <input type="text" id="diaChi" class="auth-input" disabled>
                            </div>
                            
                            <!-- Khu vực upload ảnh CCCD -->
                            <div class="auth-field-group" style="grid-column: span 2;">
                                <label>Hình ảnh CCCD</label>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px;">
                                    <!-- Mặt trước -->
                                    <div style="border: 2px dashed var(--border); border-radius: 8px; padding: 16px; text-align: center; position: relative;">
                                        <p style="font-size: 12px; margin-bottom: 8px;">Mặt trước</p>
                                        <img id="preview-cccd-truoc" src="https://via.placeholder.com/300x190?text=Chưa+có+ảnh+mặt+trước" style="width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px;">
                                        <input type="file" id="file-cccd-truoc" accept="image/*" disabled style="display: none;">
                                        <label for="file-cccd-truoc" id="label-cccd-truoc" style="display: none; cursor: pointer; background: var(--accent); color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; margin-top: 10px;">Chọn ảnh</label>
                                    </div>
                                    <!-- Mặt sau -->
                                    <div style="border: 2px dashed var(--border); border-radius: 8px; padding: 16px; text-align: center; position: relative;">
                                        <p style="font-size: 12px; margin-bottom: 8px;">Mặt sau</p>
                                        <img id="preview-cccd-sau" src="https://via.placeholder.com/300x190?text=Chưa+có+ảnh+mặt+sau" style="width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px;">
                                        <input type="file" id="file-cccd-sau" accept="image/*" disabled style="display: none;">
                                        <label for="file-cccd-sau" id="label-cccd-sau" style="display: none; cursor: pointer; background: var(--accent); color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; margin-top: 10px;">Chọn ảnh</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div style="margin-top: 24px; display: flex; gap: 12px;">
                            <button type="button" id="btn-edit-profile" class="auth-submit-btn" style="padding: 12px 32px; background-color: var(--accent); display: none;">
                                <i class="fa-solid fa-pen"></i> Sửa thông tin
                            </button>
                            <button type="submit" id="btn-save-profile" class="auth-submit-btn" style="padding: 12px 32px; display: none;">Lưu thông tin</button>
                            <button type="button" id="btn-cancel-edit" class="auth-submit-btn" style="padding: 12px 32px; display: none; background-color: #6c757d;">Hủy</button>
                        </div>
                    </form>
                </section>

                <!-- WALLET SECTION -->
                <section class="content-section" id="wallet-sec">
                    <h2 class="section-header-title">Quản lý Ví</h2>

                    
                    
                    <div class="wallet-balance-card">
                        <div>
                            <h4>Số dư khả dụng</h4>
                            <div class="balance-amount" id="wallet-balance">0 ₫</div>
                        </div>
                        <button class="btn btn-white btn-sm" id="topup-btn">Nạp tiền ngay</button>
                    </div>

                    <div style="background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-top: 24px; margin-bottom: 24px;">
                        <h3 style="font-size: 16px; margin-bottom: 16px; font-weight: 600;">Tài khoản ngân hàng (Dùng để rút tiền)</h3>
                        <form id="bank-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="auth-field-group">
                                <label>Tên ngân hàng</label>
                                <input type="text" id="tenNganHang" class="auth-input bank-input" disabled placeholder="VD: Vietcombank">
                            </div>
                            <div class="auth-field-group">
                                <label>Số tài khoản</label>
                                <input type="text" id="soTaiKhoan" class="auth-input bank-input" disabled placeholder="Nhập số tài khoản">
                            </div>
                            <div style="grid-column: span 2; display: flex; gap: 12px; margin-top: 8px;">
                                <button type="button" id="btn-edit-bank" class="auth-submit-btn" style="width: auto; padding: 8px 16px; font-size: 13px;">Sửa tài khoản</button>
                                <button type="button" id="btn-cancel-bank" class="auth-submit-btn" style="width: auto; padding: 8px 16px; font-size: 13px; background: var(--bg-secondary); color: var(--text-primary); display: none;">Hủy</button>
                                <button type="submit" id="btn-save-bank" class="auth-submit-btn" style="width: auto; padding: 8px 16px; font-size: 13px; display: none;">Lưu tài khoản</button>
                            </div>
                        </form>
                    </div>
                    
                    <h4>Lịch sử giao dịch</h4>
                    <table class="txn-table">
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Loại</th>
                                <th>Số tiền</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="txn-list">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </section>

            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <!-- Script Components -->
    <script src="js/components.js"></script>
    <script src="js/customer.js"></script>

    <!-- POPUP NẠP TIỀN DEMO -->
<div id="topup-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: var(--card-bg); padding: 24px; border-radius: var(--radius-lg); width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);">
        <h3 style="margin-bottom: 16px; font-size: 20px; font-weight: 700;">Nạp tiền vào ví</h3>
        
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 14px; margin-bottom: 8px; color: var(--text-secondary);">Chọn nhanh mệnh giá:</label>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                <button type="button" class="preset-btn" data-value="50000" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); cursor: pointer;">50.000 ₫</button>
                <button type="button" class="preset-btn" data-value="100000" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); cursor: pointer;">100.000 ₫</button>
                <button type="button" class="preset-btn" data-value="200000" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); cursor: pointer;">200.000 ₫</button>
                <button type="button" class="preset-btn" data-value="500000" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); cursor: pointer;">500.000 ₫</button>
                <button type="button" class="preset-btn" data-value="1000000" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); cursor: pointer;">1.000.000 ₫</button>
                <button type="button" class="preset-btn" data-value="2000000" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); cursor: pointer;">2.000.000 ₫</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 14px; margin-bottom: 8px; color: var(--text-secondary);">Hoặc nhập số tiền tùy chỉnh:</label>
            <input type="number" id="custom-amount-input" placeholder="Nhập số tiền..." style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-primary); color: var(--text-primary);">
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" id="close-modal-btn" style="padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; color: var(--text-secondary);">Hủy</button>
            <button type="button" id="confirm-topup-btn" style="padding: 8px 16px; border: none; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; font-weight: 600;">Xác nhận nạp</button>
        </div>
    </div>
</div>
</body>
</html>
