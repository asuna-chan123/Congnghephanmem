<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - E-Tech Store</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS (sharing styles with home page + custom product detail styles) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/StaggeredMenu.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* Specific page styles to prevent cluttering main stylesheet too much */
        .detail-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 50px;
            margin-top: 30px;
            margin-bottom: 60px;
        }

        .gallery-box {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 450px;
            box-shadow: var(--shadow-sm);
        }

        .gallery-box img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: var(--radius-md);
        }

        .favorite-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .favorite-toggle-btn.favorited {
            color: #ef4444;
            background-color: #fef2f2;
            border-color: #fca5a5;
        }

        .product-meta {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-meta h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
        }

        .rating-summary {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .stars {
            color: #fbbf24;
        }

        .main-content {
            padding-top: 50px;
        }

        .price-box {
            background-color: var(--light);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin: 10px 0;
        }

        .price-box-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .rental-price-large {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .rental-price-large span {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .buy-price-small {
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .buy-price-value {
            font-weight: 700;
            color: var(--text-main);
            font-size: 16px;
        }

        .option-group {
            margin-bottom: 22px;
        }

        .option-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            color: var(--text-main);
        }

        /* Huawei-style Navigation Tabs */
        .huawei-product-nav-tabs {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 500;
        }

        .huawei-tab-item {
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .huawei-tab-item:hover,
        .huawei-tab-item.active {
            color: var(--accent);
        }

        .huawei-tab-divider {
            color: var(--border-strong);
            font-size: 11px;
            user-select: none;
        }

        /* Huawei-style Model Card */
        .huawei-model-card {
            border: 1px solid var(--border-strong);
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .huawei-model-card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .huawei-model-card-features {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .huawei-model-card-features li {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .huawei-model-card-features li::before {
            content: "•";
            color: var(--accent);
            font-weight: bold;
        }

        /* Color Swatches Selector */
        .color-swatches {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .color-swatch-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .color-swatch-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-in-out;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-swatch-wrapper:hover .color-swatch-circle {
            transform: scale(1.1);
        }

        .color-swatch-wrapper.active .color-swatch-circle {
            box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--text-primary);
        }

        .color-swatch-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .color-swatch-wrapper.active .color-swatch-label {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Capacity Selector Blocks */
        .capacity-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .capacity-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--card-bg);
            cursor: pointer;
            transition: var(--transition);
        }

        .capacity-card:hover {
            border-color: var(--border-strong);
            background-color: var(--bg-secondary);
        }

        .capacity-card.active {
            border-color: var(--text-primary);
            background-color: var(--bg-secondary);
        }

        .capacity-card.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
            background-color: #fafafa;
            border-color: #e5e5e7;
        }

        .color-swatch-wrapper.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .capacity-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .capacity-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .capacity-card.active .capacity-price {
            color: var(--text-primary);
        }

        /* Stepper for Quantity Selector */
        .quantity-stepper {
            display: inline-flex;
            align-items: center;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            overflow: hidden;
            background-color: var(--card-bg);
        }

        .stepper-btn {
            border: none;
            background: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
            font-size: 14px;
        }

        .stepper-btn:hover {
            background-color: var(--bg-secondary);
        }

        .stepper-val {
            width: 44px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border: none;
            outline: none;
            background: none;
            color: var(--text-primary);
            pointer-events: none;
        }

        /* Collapsible Description Box */
        .collapsible-description-box {
            margin-top: 30px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--card-bg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .collapsible-description-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }

        .collapsible-description-header h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .collapsible-description-header .toggle-icon {
            font-size: 14px;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .collapsible-description-body {
            position: relative;
            max-height: 120px;
            /* Short view height */
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .collapsible-description-body.expanded {
            max-height: 2000px;
            /* Expand fully */
        }

        .collapsible-description-body .description-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, var(--card-bg));
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .collapsible-description-body.expanded .description-overlay {
            opacity: 0;
        }

        .collapsible-description-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .collapsible-description-footer {
            display: flex;
            justify-content: center;
            padding: 10px 0 16px 0;
            border-top: 1px solid transparent;
        }

        .btn-toggle-description {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-toggle-description:hover {
            color: var(--accent-hover);
        }

        .booking-calendar-box {
            border: 2.5px solid var(--accent);
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
        }

        [data-theme="dark"] .booking-calendar-box {
            background-color: #00000020;
            border-color: var(--accent);
        }

        .calendar-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .calendar-input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        .calendar-input-group input {
            width: 100%;
            padding: 10px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .calendar-input-group input:focus {
            border-color: var(--accent);
        }

        .blocked-dates-info {
            font-size: 12px;
            color: #ef4444;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-actions {
            display: flex;
            justify-content: center;
            padding-top: 12px;
        }

        .btn-try-prominent {
            background-color: #0066cc;
            color: #ffffff;
            font-family: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 17px;
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -0.374px;
            border: none;
            border-radius: 9999px;
            padding: 11px 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: none;
            width: 100%;
            max-width: 380px;
        }

        .btn-try-prominent:hover {
            background-color: #0071e3;
        }

        .btn-try-prominent:active {
            transform: scale(0.95);
        }

        .btn-try-prominent:focus-visible {
            outline: 2px solid #0071e3;
            outline-offset: 2px;
        }

        .btn-try-prominent:disabled {
            background-color: #d2d2d7;
            color: #7a7a7a;
            cursor: not-allowed;
        }

        .btn-outline {
            border: 1.5px solid var(--text-primary);
            background-color: transparent;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            padding: 14px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-outline:hover {
            background-color: var(--text-primary);
            color: var(--card-bg);
        }

        .reviews-section {
            margin-top: 60px;
            border-top: 1px solid var(--border);
            padding-top: 40px;
        }

        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .reviews-summary-stats {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .reviews-average-number {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-main);
        }

        .review-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .review-user-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }

        .review-username {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
        }

        .review-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .review-comment {
            font-size: 14px;
            color: var(--text-main);
            margin-top: 8px;
        }

        /* Tab Controls */
        .reviews-tabs {
            display: flex;
            gap: 16px;
            border-bottom: 2px solid #e5e5e7;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #7a7a7a;
            cursor: pointer;
            position: relative;
            font-family: inherit;
        }

        .tab-btn.active {
            color: #0066cc;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #0066cc;
        }

        /* Badges */
        .purchase-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            display: inline-block;
        }

        .badge-purchased {
            background-color: rgba(5, 150, 105, 0.1);
            color: #047857;
        }

        .badge-not-purchased {
            background-color: #f5f5f7;
            color: #7a7a7a;
        }

        .badge-staff {
            background-color: rgba(0, 102, 204, 0.1);
            color: #0066cc;
        }

        /* Reply style */
        .reply-container {
            margin-top: 16px;
            padding-left: 20px;
            border-left: 2px solid #e5e5e7;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reply-card {
            background-color: #fafafc;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
        }

        .reply-user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        /* Buttons & Forms */
        .btn-reply-toggle {
            background: none;
            border: none;
            color: #0066cc;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .reply-form-wrapper {
            margin-top: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .reply-input-textarea {
            width: 100%;
            height: 60px;
            padding: 8px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
        }

        .submit-reply-btn {
            align-self: flex-end;
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Review & QA Form */
        .form-section-box {
            background: #fafafc;
            border: 1px solid #e5e5e7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1d1d1f;
        }

        .rating-stars-input {
            display: flex;
            gap: 8px;
            font-size: 24px;
            color: #d2d2d7;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .rating-stars-input i.active {
            color: #ff9500;
        }

        .form-textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .detail-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation (Etsy Inspired) -->
    <custom-header></custom-header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Detail Grid -->
        <div class="detail-layout" id="product-detail-layout">
            <!-- Loading state -->
            <div class="loading-spinner" style="grid-column: 1 / -1;">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông tin chi tiết sản phẩm...
            </div>
        </div>

        <!-- Reviews Section -->
        <section class="reviews-section">
            <div class="reviews-tabs">
                <button class="tab-btn active" id="tab-reviews-btn" onclick="switchReviewsTab('reviews')">Đánh giá từ
                    khách hàng</button>
                <button class="tab-btn" id="tab-qa-btn" onclick="switchReviewsTab('qa')">Hỏi & Đáp (Q&A)</button>
            </div>

            <!-- Tab Content: Reviews -->
            <div id="tab-content-reviews" class="tab-content">
                <div class="reviews-header" style="margin-bottom: 24px;">
                    <div>
                        <h4 style="font-size: 18px; font-weight:600; margin: 0;">Điểm đánh giá trung bình</h4>
                    </div>
                    <div class="reviews-summary-stats">
                        <div class="reviews-average-number" id="avg-rating-val">0.0</div>
                        <div>
                            <div class="stars" id="avg-stars-container" style="color: #ff9500; font-size: 16px;">
                                <!-- stars -->
                            </div>
                            <span id="reviews-count-label" style="font-size: 13px; color: var(--text-muted);">0 đánh
                                giá</span>
                        </div>
                    </div>
                </div>

                <!-- Write Review Form Section -->
                <div id="review-form-container" class="form-section-box">
                    <!-- Form will be dynamically updated based on eligibility -->
                    <h5 class="form-title">Đánh giá sản phẩm này</h5>
                    <div class="rating-stars-input" id="stars-input-container">
                        <i class="fa-solid fa-star" data-rating="1"></i>
                        <i class="fa-solid fa-star" data-rating="2"></i>
                        <i class="fa-solid fa-star" data-rating="3"></i>
                        <i class="fa-solid fa-star" data-rating="4"></i>
                        <i class="fa-solid fa-star" data-rating="5"></i>
                    </div>
                    <textarea id="review-comment-textarea" class="form-textarea"
                        placeholder="Chia sẻ trải nghiệm sử dụng thực tế của bạn về thiết bị này..."></textarea>
                    <button class="btn btn-primary" onclick="submitUserReview()"
                        style="padding: 10px 24px; font-size:14px; border-radius: 9999px;">Gửi Đánh Giá</button>
                </div>

                <div id="reviews-list-container">
                    <!-- Review cards injected here -->
                </div>
            </div>

            <!-- Tab Content: QA -->
            <div id="tab-content-qa" class="tab-content" style="display: none;">
                <!-- Write Question Form Section -->
                <div id="qa-form-container" class="form-section-box">
                    <h5 class="form-title">Đặt câu hỏi về sản phẩm</h5>
                    <textarea id="qa-comment-textarea" class="form-textarea"
                        placeholder="Đặt câu hỏi về sản phẩm, cấu hình, phương thức thuê..."></textarea>
                    <button class="btn btn-primary" onclick="submitUserQuestion()"
                        style="padding: 10px 24px; font-size:14px; border-radius: 9999px;">Gửi Câu Hỏi</button>
                </div>

                <div id="qa-list-container">
                    <!-- QA cards injected here -->
                </div>
            </div>
        </section>

        <!-- Related Products Section -->
        <section class="related-section">
            <div class="section-title-wrapper">
                <div>
                    <span class="section-subtitle">Có thể bạn cũng thích</span>
