version: '3.8'

networks:
  monitoring_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # 1. PROMETHEUS - Bộ thu thập và lưu trữ số liệu (Metrics Engine)
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: tech_rental_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring_net

  # 2. GRAFANA - Giao diện Admin Kỹ thuật & Dashboard Trực quan
  grafana:
    image: grafana/grafana:10.4.1
    container_name: tech_rental_grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # Cổng 3001 trên máy tính để tránh xung đột cổng 3000 của Web Node.js
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

  # 3. NODE EXPORTER - Giám sát phần cứng Server
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: tech_rental_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring_net

  # 4. LOKI - Quản lý và lập chỉ mục Log tập trung
  loki:
    image: grafana/loki:3.0.0
    container_name: tech_rental_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_net

  # 5. PROMTAIL - Đọc file logs/app.log chuyển tiếp vào Loki
  promtail:
    image: grafana/promtail:3.0.0
    container_name: tech_rental_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net
    depends_on:
      - loki
